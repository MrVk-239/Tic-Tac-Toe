<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic Tac Toe — Series Mode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <!-- Left Control Panel -->
    <div class="panel">
      <h1>🎮 Tic Tac Toe — Series</h1>
      <div class="subtitle">Choose a series length, then battle it out. Overall winner takes the crown! 🏆</div>

      <div class="controls">
        <div class="row">
          <label class="tag">Series Length</label>
          <select id="seriesSelect">
            <option value="3">Best of 3</option>
            <option value="5" selected>Best of 5</option>
            <option value="7">Best of 7</option>
            <option value="9">Best of 9</option>
            <option value="custom">Custom…</option>
          </select>
          <input type="number" id="customInput" min="1" step="2" placeholder="odd number (e.g., 11)" style="display:none">
        </div>
        <div class="row">
          <button id="newSeriesBtn">Start / Reset Series</button>
          <button id="swapStarterBtn" class="secondary" title="Alternate who starts next round">Swap Starter</button>
        </div>
      </div>

      <div class="progress"><div id="progressFill"></div></div>

      <div class="score">
        <div class="card x">
          <div class="label">Player X</div>
          <div class="val" id="scoreX">0</div>
        </div>
        <div class="card o">
          <div class="label">Player O</div>
          <div class="val" id="scoreO">0</div>
        </div>
        <div class="card d">
          <div class="label">Draws</div>
          <div class="val" id="scoreD">0</div>
        </div>
      </div>

      <div class="note">Tip: Use <b>Next Round</b> after each game to keep the series going. You can also alternate the starting player each round.</div>
    </div>

    <!-- Game Board -->
    <div class="board">
      <div class="status">
        <div id="roundTag" class="tag">Round 1</div>
        <div id="turnTag" class="tag x">Turn: X</div>
        <div id="seriesTag" class="tag">Series: 0 / 0</div>
      </div>

      <div id="toast" class="toast">Message</div>

      <div class="grid" id="grid"></div>

      <div class="footer">
        <button id="nextRoundBtn" class="secondary" disabled>Next Round</button>
        <button id="resetBoardBtn" class="ghost">Clear Board</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
