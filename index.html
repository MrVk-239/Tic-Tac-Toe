<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic Tac Toe — Series Mode</title>
<style>
  :root{
    --bg1:#0f1224; --bg2:#1e1b4b; --glass:rgba(255,255,255,.08);
    --accent:#6ee7b7; --accent2:#60a5fa; --text:#eef2ff; --muted:#9aa3b2;
    --win:#22d3ee; --x:#fca5a5; --o:#93c5fd;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(1000px 600px at 10% 10%, #111432 0%, #0b0f22 40%, #060913 100%),
                conic-gradient(from 180deg at 70% 20%, #0e122d, #1c1a46, #0e122d);
    color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
  }
  .wrap{
    width:min(1100px, 95vw); display:grid; grid-template-columns: 340px 1fr; gap:24px; padding:24px;
  }
  .panel, .board{
    background:var(--glass); backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,.12); border-radius:20px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  /* Left Panel */
  .panel{ padding:20px }
  h1{ margin:0 0 10px; font-size:28px; letter-spacing:.5px }
  .subtitle{ color:var(--muted); font-size:14px; margin-bottom:18px }
  .controls{ display:grid; gap:12px; margin-bottom:18px }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  select, input[type="number"]{
    background:#0c1022; color:var(--text); border:1px solid rgba(255,255,255,.14);
    padding:10px 12px; border-radius:12px; outline:none; flex:1 1 auto;
  }
  button{
    border:0; background: linear-gradient(135deg, var(--accent2), var(--accent));
    color:#0b1020; padding:10px 14px; border-radius:12px; font-weight:700; cursor:pointer;
    transition: transform .06s ease, box-shadow .2s ease;
    box-shadow: 0 6px 18px rgba(96,165,250,.25);
  }
  button:hover{ transform: translateY(-1px) }
  button.secondary{
    background: transparent; color:var(--text); border:1px solid rgba(255,255,255,.18);
    box-shadow:none;
  }
  button.ghost{ background:transparent; color:var(--muted); border:1px dashed rgba(255,255,255,.18) }

  .progress{
    margin:12px 0 18px; height:10px; background:#0c1022; border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,.12);
  }
  .progress > div{
    height:100%; width:0%; background:linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .4s ease;
  }

  .score{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:6px;
  }
  .score .card{
    background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:12px; text-align:center;
  }
  .score .label{ color:var(--muted); font-size:12px }
  .score .val{ font-size:28px; font-weight:800; margin-top:4px }
  .x .val{ color:var(--x) } .o .val{ color:var(--o) } .d .val{ color:var(--win) }

  .note{ color:var(--muted); font-size:12px; margin-top:10px }

  /* Board */
  .board{
    padding:22px; display:grid; grid-template-rows: auto 1fr auto; gap:16px; position:relative;
  }
  .status{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    padding:12px 14px; border-radius:12px;
  }
  .tag{
    padding:6px 10px; border-radius:999px; font-weight:700; font-size:12px; letter-spacing:.3px;
    background: #0d1228; border:1px solid rgba(255,255,255,.15); color:var(--muted);
  }
  .tag.x{ color:var(--x); border-color:rgba(252,165,165,.35) }
  .tag.o{ color:var(--o); border-color:rgba(147,197,253,.35) }

  .grid{
    margin:6px auto; width:min(520px, 90%); aspect-ratio:1 / 1;
    display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;
  }
  .cell{
    user-select:none; display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:18px; font-size: clamp(40px, 9vw, 72px); font-weight:900; cursor:pointer;
    transition: transform .08s ease, background .25s ease, box-shadow .25s ease, border-color .25s ease;
    text-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  .cell:hover{ transform: translateY(-2px); background: rgba(255,255,255,.14) }
  .cell.disabled{ pointer-events:none; opacity:.9 }
  .cell.x{ color:var(--x) } .cell.o{ color:var(--o) }

  .winner{
    animation: glow 800ms ease-in-out infinite alternate;
    box-shadow: 0 0 0 2px rgba(255,255,255,.18), 0 12px 40px rgba(34,211,238,.25) !important;
    border-color: rgba(34,211,238,.65) !important;
  }
  @keyframes glow{
    from{ filter: drop-shadow(0 0 8px rgba(34,211,238,.5)) }
    to{ filter: drop-shadow(0 0 16px rgba(34,211,238,.85)) }
  }

  .footer{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }

  /* Toast */
  .toast{
    position:absolute; left:50%; top:12px; transform:translateX(-50%);
    background:rgba(15,23,42,.9); border:1px solid rgba(255,255,255,.14);
    color:var(--text); padding:10px 14px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0) }

  @media (max-width: 880px){
    .wrap{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Left Control Panel -->
    <div class="panel">
      <h1>🎮 Tic Tac Toe — Series</h1>
      <div class="subtitle">Choose a series length, then battle it out. Overall winner takes the crown! 🏆</div>

      <div class="controls">
        <div class="row">
          <label class="tag">Series Length</label>
          <select id="seriesSelect">
            <option value="3">Best of 3</option>
            <option value="5" selected>Best of 5</option>
            <option value="7">Best of 7</option>
            <option value="9">Best of 9</option>
            <option value="custom">Custom…</option>
          </select>
          <input type="number" id="customInput" min="1" step="2" placeholder="odd number (e.g., 11)" style="display:none">
        </div>
        <div class="row">
          <button id="newSeriesBtn">Start / Reset Series</button>
          <button id="swapStarterBtn" class="secondary" title="Alternate who starts next round">Swap Starter</button>
        </div>
      </div>

      <div class="progress"><div id="progressFill"></div></div>

      <div class="score">
        <div class="card x">
          <div class="label">Player X</div>
          <div class="val" id="scoreX">0</div>
        </div>
        <div class="card o">
          <div class="label">Player O</div>
          <div class="val" id="scoreO">0</div>
        </div>
        <div class="card d">
          <div class="label">Draws</div>
          <div class="val" id="scoreD">0</div>
        </div>
      </div>

      <div class="note">Tip: Use <b>Next Round</b> after each game to keep the series going. You can also alternate the starting player each round.</div>
    </div>

    <!-- Game Board -->
    <div class="board">
      <div class="status">
        <div id="roundTag" class="tag">Round 1</div>
        <div id="turnTag" class="tag x">Turn: X</div>
        <div id="seriesTag" class="tag">Series: 0 / 0</div>
      </div>

      <div id="toast" class="toast">Message</div>

      <div class="grid" id="grid"></div>

      <div class="footer">
        <button id="nextRoundBtn" class="secondary" disabled>Next Round</button>
        <button id="resetBoardBtn" class="ghost">Clear Board</button>
      </div>
    </div>
  </div>

<script>
  // --- State ---
  const gridEl = document.getElementById('grid');
  const turnTag = document.getElementById('turnTag');
  const roundTag = document.getElementById('roundTag');
  const seriesTag = document.getElementById('seriesTag');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDEl = document.getElementById('scoreD');
  const progressFill = document.getElementById('progressFill');
  const toast = document.getElementById('toast');

  const seriesSelect = document.getElementById('seriesSelect');
  const customInput = document.getElementById('customInput');
  const newSeriesBtn = document.getElementById('newSeriesBtn');
  const swapStarterBtn = document.getElementById('swapStarterBtn');
  const nextRoundBtn = document.getElementById('nextRoundBtn');
  const resetBoardBtn = document.getElementById('resetBoardBtn');

  let board = Array(9).fill('');
  let currentPlayer = 'X';
  let starterPlayer = 'X';
  let gameActive = true;

  let winsX = 0, winsO = 0, draws = 0, roundsPlayed = 0, seriesLength = 5;

  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6],
  ];

  // --- UI Helpers ---
  function showToast(msg, ms=1500){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), ms);
  }

  function setTurnTag(p){
    turnTag.textContent = `Turn: ${p}`;
    turnTag.className = `tag ${p.toLowerCase()}`;
  }

  function updateSeriesTags(){
    roundTag.textContent = `Round ${roundsPlayed + 1}`;
    seriesTag.textContent = `Series: ${roundsPlayed} / ${seriesLength}`;
    const pct = seriesLength ? Math.min(100, Math.round((roundsPlayed/seriesLength)*100)) : 0;
    progressFill.style.width = pct + '%';
  }

  function paintBoard(){
    gridEl.innerHTML = '';
    board.forEach((val, i)=>{
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ' disabled '+val.toLowerCase() : '');
      cell.dataset.idx = i;
      cell.textContent = val;
      if(gameActive && !val) cell.addEventListener('click', onCell);
      gridEl.appendChild(cell);
    });
  }

  // --- Game Logic ---
  function checkWin(player){
    for(const [a,b,c] of wins){
      if(board[a]===player && board[b]===player && board[c]===player){
        markWinners([a,b,c]);
        return true;
      }
    }
    return false;
  }

  function markWinners(arr){
    const cells = [...gridEl.children];
    arr.forEach(i=>{
      cells[i].classList.add('winner');
    });
  }

  function onCell(e){
    const i = +e.currentTarget.dataset.idx;
    if(board[i] || !gameActive) return;
    board[i] = currentPlayer;
    paintBoard();

    if(checkWin(currentPlayer)){
      gameActive = false;
      if(currentPlayer==='X'){ winsX++; scoreXEl.textContent = winsX; }
      else { winsO++; scoreOEl.textContent = winsO; }
      roundsPlayed++;
      updateSeriesTags();
      nextRoundBtn.disabled = false;
      showToast(`🎉 ${currentPlayer} wins this round!`);
      checkSeriesEnd();
      return;
    }

    if(board.every(v=>v)){
      gameActive = false; draws++; scoreDEl.textContent = draws;
      roundsPlayed++;
      updateSeriesTags();
      nextRoundBtn.disabled = false;
      showToast('🤝 Draw!');
      checkSeriesEnd();
      return;
    }

    currentPlayer = currentPlayer==='X' ? 'O' : 'X';
    setTurnTag(currentPlayer);
  }

  function clearBoard(keepStarter=true){
    board = Array(9).fill('');
    gameActive = true;
    currentPlayer = keepStarter ? starterPlayer : 'X';
    setTurnTag(currentPlayer);
    paintBoard();
  }

  function nextRound(){
    // Alternate starter for fairness
    starterPlayer = starterPlayer==='X' ? 'O' : 'X';
    clearBoard(true);
    nextRoundBtn.disabled = true;
    updateSeriesTags();
  }

  function checkSeriesEnd(){
    if(roundsPlayed >= seriesLength){
      gameActive = false;
      const winner = winsX===winsO ? 'No one — it\'s a tie!' : (winsX>winsO ? 'Player X' : 'Player O');
      showToast(`🏆 Series complete! Winner: ${winner}`, 2200);
      nextRoundBtn.disabled = true;
    }
  }

  // --- Series Controls ---
  seriesSelect.addEventListener('change', ()=>{
    if(seriesSelect.value==='custom'){
      customInput.style.display = 'block';
      customInput.focus();
    }else{
      customInput.style.display = 'none';
    }
  });

  newSeriesBtn.addEventListener('click', ()=>{
    let len = seriesSelect.value==='custom' ? parseInt(customInput.value,10) : parseInt(seriesSelect.value,10);
    if(!len || len<1){ showToast('Enter a valid series length'); return; }
    if(len%2===0){ showToast('Use an odd number (best-of)'); return; }

    seriesLength = len;
    winsX = winsO = draws = roundsPlayed = 0;
    scoreXEl.textContent = '0'; scoreOEl.textContent = '0'; scoreDEl.textContent = '0';
    starterPlayer = 'X'; // reset starter by default
    clearBoard(true);
    nextRoundBtn.disabled = true;
    updateSeriesTags();
    showToast(`New series: Best of ${seriesLength}`);
  });

  swapStarterBtn.addEventListener('click', ()=>{
    starterPlayer = (starterPlayer==='X') ? 'O' : 'X';
    currentPlayer = starterPlayer;
    setTurnTag(currentPlayer);
    showToast(`Starter swapped to ${starterPlayer}`);
  });

  nextRoundBtn.addEventListener('click', ()=>{
    if(roundsPlayed >= seriesLength){ showToast('Series finished. Start a new one!'); return; }
    nextRound();
  });

  resetBoardBtn.addEventListener('click', ()=>{
    clearBoard(); // keep current starter
    nextRoundBtn.disabled = true;
    showToast('Board cleared');
  });

  // --- Init ---
  updateSeriesTags();
  setTurnTag(currentPlayer);
  paintBoard();
</script>
</body>
</html>
